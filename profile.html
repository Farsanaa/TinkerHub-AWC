<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile | TinkerHub</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
     <link rel="icon" type="image/png" href="logoo.png"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,500;1,700&family=Permanent+Marker&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script type="module" src="./analytics.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: "#FFFFFF",
                        ink: "#111111",
                        inkLighter: "#333333",
                        pastelYellow: "#FFF73A",
                        pastelPink: "#FFB5D8",
                        pastelBlue: "#B5E5F9",
                        pastelGreen: "#C3FF16",
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                        display: ["Playfair Display", "serif"],
                    }
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FFFFFF;
            background-image:
                linear-gradient(#e5e7eb 1px, transparent 1px),
                linear-gradient(90deg, #e5e7eb 1px, transparent 1px);
            background-size: 30px 30px;
            color: #111111;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Glassmorphism Utilities tailored for light background */
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            transition: all 0.3s ease;
        }
        
        .glass-panel:hover {
            box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.1);
        }

        .btn-fill-ink {
            position: relative;
            overflow: hidden;
            z-index: 1;
            background: transparent;
            color: #111111;
            border: 2px solid #111111;
            transition: color 0.4s ease;
            font-weight: bold;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
        }
        .btn-fill-ink::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background-color: #111111;
            z-index: -1;
            transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .btn-fill-ink:hover {
            color: #ffffff;
        }
        .btn-fill-ink:hover::before {
            width: 100%;
        }
        
        .float-anim { animation: float 6s ease-in-out infinite; }
        .float-anim-alt { animation: float-alt 7s ease-in-out infinite reverse; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        @keyframes float-alt {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-15px) rotate(-10deg); }
        }
    </style>
</head>
<body class="relative flex items-center justify-center p-4 sm:p-8">

    <!-- Back to Main Button -->
    <a href="index.html" class="absolute top-6 left-6 z-50 inline-flex items-center gap-2 font-sans font-bold text-ink hover:text-inkLighter transition-colors group px-4 py-2">
        <span class="material-symbols-outlined transition-transform group-hover:-translate-x-1">arrow_back</span>
        Back to Campus
    </a>

    <!-- Animated Background Shapes -->
    <div class="hidden md:block absolute inset-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div class="absolute top-[15%] left-[25%] w-64 h-64 bg-pastelPink rounded-full opacity-60 mix-blend-multiply filter blur-3xl float-anim"></div>
        <div class="absolute bottom-[10%] right-[20%] w-80 h-80 bg-pastelBlue rounded-full opacity-60 mix-blend-multiply filter blur-3xl float-anim-alt" style="animation-delay: 2s;"></div>
        <div class="absolute top-[40%] right-[30%] w-56 h-56 bg-pastelYellow rounded-full opacity-60 mix-blend-multiply filter blur-2xl float-anim" style="animation-delay: 4s;"></div>
    </div>

    <!-- Main Container -->
    <div class="w-full max-w-lg z-10 glass-panel rounded-3xl p-8 sm:p-12 relative overflow-hidden flex flex-col items-center text-center">
        <!-- Top decorative tape -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-24 h-6 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC44KSIvPjwvc3ZnPg==')] opacity-80 mix-blend-overlay rotate-2 shadow-sm border border-white/40"></div>

        <!-- Loading State -->
        <div id="loading-state" class="w-full py-12 flex flex-col items-center justify-center">
            <span class="material-symbols-outlined animate-spin text-4xl text-ink/50 mb-4">progress_activity</span>
            <p class="font-sans text-ink/70 font-medium">Loading profile...</p>
        </div>

        <!-- Profile Content -->
        <div id="profile-content" class="w-full hidden flex-col items-center">
            
            <!-- Avatar -->
            <div class="w-24 h-24 rounded-full bg-pastelGreen border-2 border-ink flex items-center justify-center shadow-sticker mb-6 transform -rotate-3">
                <span class="material-symbols-outlined text-5xl text-ink">person</span>
            </div>

            <!-- Header -->
            <h1 id="profile-name" class="font-display text-3xl font-black text-ink mb-1"></h1>
            <p id="profile-email" class="font-sans text-sm text-ink/70 font-medium mb-8"></p>

            <!-- Details List -->
            <div class="w-full bg-white/50 rounded-xl border border-white/60 p-6 text-left flex flex-col gap-4 mb-8">
                
                <div class="flex items-start gap-3">
                    <span class="material-symbols-outlined text-ink/50 text-xl mt-0.5">domain</span>
                    <div>
                        <p class="font-sans text-xs text-ink/50 font-bold uppercase tracking-wider mb-0.5">Department</p>
                        <p id="profile-department" class="font-sans font-medium text-ink"></p>
                    </div>
                </div>

                <div class="flex items-start gap-3">
                    <span class="material-symbols-outlined text-ink/50 text-xl mt-0.5">school</span>
                    <div>
                        <p class="font-sans text-xs text-ink/50 font-bold uppercase tracking-wider mb-0.5">Course</p>
                        <p id="profile-course" class="font-sans font-medium text-ink"></p>
                    </div>
                </div>

                <div class="flex items-start gap-3">
                    <span class="material-symbols-outlined text-ink/50 text-xl mt-0.5">psychology</span>
                    <div>
                        <p class="font-sans text-xs text-ink/50 font-bold uppercase tracking-wider mb-0.5">Specialization</p>
                        <p id="profile-specialization" class="font-sans font-medium text-ink"></p>
                    </div>
                </div>

                <div class="flex items-start gap-3">
                    <span class="material-symbols-outlined text-ink/50 text-xl mt-0.5">badge</span>
                    <div>
                        <p class="font-sans text-xs text-ink/50 font-bold uppercase tracking-wider mb-0.5">Role</p>
                        <p id="profile-role" class="font-sans font-medium text-ink"></p>
                    </div>
                </div>

            </div>

            <!-- Logout Button -->
            <button id="logout-btn" class="btn-fill-ink w-full">
                <span>Logout</span>
                <span class="material-symbols-outlined text-sm">logout</span>
            </button>
        </div>

    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { auth, db } from "./firebase.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
        import { doc, getDoc, collection, getDocs, query, where, setDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

        const loadingState = document.getElementById("loading-state");
        const profileContent = document.getElementById("profile-content");

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                // User not logged in, redirect
                window.location.href = "join.html";
                return;
            }

            try {
                // Fetch member details
                console.log("AUTH UID:", user.uid);
                console.log("AUTH EMAIL:", user.email);
                const docRef = doc(db, "members", user.uid);
                const docSnap = await getDoc(docRef);

                let data = null;

                if (docSnap.exists()) {
                    data = docSnap.data();
                } else if (user.email) {
                    // Safe migration fallback by exact email match
                    console.log("UID document not found. Attempting safe migration by email...");
                    const membersQuery = query(collection(db, "members"), where("email", "==", user.email));
                    const querySnapshot = await getDocs(membersQuery);
                    
                    if (!querySnapshot.empty) {
                        const oldDoc = querySnapshot.docs[0];
                        data = oldDoc.data();
                        data.uid = user.uid; // Update the document with the new UID
                        
                        // Migrate to the correct user.uid document
                        await setDoc(docRef, data);
                        console.log("Migration successful.");
                    }
                }

                if (data) {
                    document.getElementById("profile-name").textContent = data.name || data.fullName || "Maker";
                    document.getElementById("profile-email").textContent = data.email || user.email;
                    document.getElementById("profile-department").textContent = data.department || "N/A";
                    document.getElementById("profile-course").textContent = data.course || "N/A";
                    document.getElementById("profile-specialization").textContent = data.specialization || "N/A";
                    document.getElementById("profile-role").textContent = data.role || "Member";

                    // Show profile
                    loadingState.style.display = "none";
                    profileContent.style.display = "flex";
                } else {
                    console.error("No such member document and no migration possible!");
                    // Document doesn't exist but user is logged in
                    document.getElementById("profile-name").textContent = "Profile Not Found";
                    document.getElementById("profile-email").textContent = user.email;
                    
                    loadingState.style.display = "none";
                    profileContent.style.display = "flex";
                }
            } catch (error) {
                console.error("Error fetching member details:", error);
                alert("Failed to load profile. Please try again later.");
            }
        });

        // Logout logic
        document.getElementById("logout-btn").addEventListener("click", async () => {
            try {
                await signOut(auth);
                // The onAuthStateChanged listener will catch this and redirect to join.html
            } catch (error) {
                console.error("Logout Error:", error);
                alert("Failed to log out. Please try again.");
            }
        });

    </script>
</body>
</html>
