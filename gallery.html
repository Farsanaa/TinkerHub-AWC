<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Memory Hub — TinkerHub AWC</title>
    <meta name="description" content="Explore cherished memories and moments from TinkerHub AWC events — categorized by each event."/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="assets/memory-hub.css"/>
    <link rel="icon" type="image/png" href="logoo.png"/>
</head>
<body>

<!-- NAV -->
<nav class="nav">
    <a href="index.html" class="nav-back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Home
    </a>
    <span class="nav-brand">TinkerHub AWC</span>
    <div class="nav-spacer" style="width:90px"></div>
</nav>

<!-- HERO -->
<section class="hero">
    <div class="hero-content">
        <div class="hero-sticker-wrap">
            <!-- <img src="stickers/border.png" alt="" class="hero-deco hero-deco--left " aria-hidden="true"/> -->
            <img src="images/Moments-Photoroom.png" alt="Moments from the Hub" class="hero-img" id="hero-img"/>
            <!-- <img src="stickers/border2.png" alt="" class="hero-deco hero-deco--right" aria-hidden="true"/> -->
        </div>
    </div>
</section>

<p class="hero-sub">Every event. Every memory. All in one place.</p>

<!-- CATEGORY FILTER -->
<section class="filter-bar">
    <div class="filter-wrap" style="display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; justify-content: center;">
        <button class="filter-btn active" data-filter="all">All Events</button>
        <button class="filter-btn" data-filter="Oole Melody">Oole Melody</button>
        <!-- <button class="filter-btn" data-filter="community">🌟 Community</button>
        <button class="filter-btn" data-filter="showcase">🏆 Showcase</button>
        <button class="filter-btn" data-filter="team">👥 Team</button> -->
        
        <!-- Removed Upload Trigger -->
    </div>
</section>

<section class="event-section" id="all-events" style="display: block;">
    <div class="gallery-grid" id="galleryGrid">
        <!-- Dynamic Firebase Images will load here -->
    </div>
</section>

<!-- FOOTER -->
<footer class="footer">
    <p>made with ♡ by TinkerHub AWC · 2025</p>
</footer>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="if(event.target===this)closeLightbox()">
    <div class="lb-card">
        <button class="lb-close" id="lb-close" onclick="closeLightbox()">✕</button>
        <img class="lb-img" id="lb-img" src="" alt=""/>
        <p class="lb-caption" id="lb-caption"></p>
    </div>
</div>

<script type="module">
// Lightbox functions attached to window so inline onclick can use them
window.openLightbox = function(src, cap) {
    document.getElementById('lb-img').src = src;
    document.getElementById('lb-caption').textContent = cap;
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
}
window.closeLightbox = function() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') window.closeLightbox(); });

const filterBtns = document.querySelectorAll('.filter-btn[data-filter]');
filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        
        const galleryItems = document.querySelectorAll('.gallery-item');
        galleryItems.forEach(item => {
            if (filter === 'all' || item.dataset.cat === filter) {
                item.style.display = 'block';
                item.style.animation = 'none';
                void item.offsetWidth;
                item.style.animation = 'fadeSlideUp 0.5s ease forwards';
            } else {
                item.style.display = 'none';
            }
        });
    });
});

const galleryGrid = document.getElementById('galleryGrid');

// Setup Intersection Observer for animations
const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            const index = Array.from(galleryGrid.children).indexOf(entry.target);
            setTimeout(() => {
                entry.target.classList.add('visible');
            }, (index % 6) * 90);
            observer.unobserve(entry.target);
        }
    });
}, { threshold: 0.12 });

// Static Gallery Images
// To add new photos, place them in the 'images/gallery/' folder and add the file details here.
const galleryPhotos = [
    { src: "stickers/1.png", caption: "Moment 1", category: "Oole Melody" },
    { src: "stickers/2.png", caption: "Moment 2", category: "Oole Melody" },
    { src: "stickers/3.png", caption: "Moment 3", category: "Oole Melody" },
    { src: "stickers/4.png", caption: "Moment 4", category: "Oole Melody" },
    { src: "stickers/core-team.png", caption: "Core Team", category: "all" },
    { src: "stickers/faculty co-melody.png", caption: "Faculty Co-Melody", category: "Oole Melody" },
    { src: "stickers/FARAN.png", caption: "Faran", category: "all" },
    { src: "stickers/OLE MELODY BANNER.png", caption: "Oole Melody Banner", category: "Oole Melody" },
    { src: "images/Moments-Photoroom.png", caption: "Moments from the Hub", category: "all" },
    { src: "images/everyone.png", caption: "TinkerHub Members", category: "all" }
];

function loadGallery() {
    galleryPhotos.forEach((photo) => {
        const item = createGalleryItem(photo.src, photo.caption, photo.category);
        galleryGrid.appendChild(item);
        observer.observe(item);
    });
}

function createGalleryItem(imgUrl, captionText, category) {
    const newItem = document.createElement("div");
    newItem.className = "gallery-item";
    newItem.setAttribute("data-cat", category || "all"); 
    
    // We need to safely construct the onclick handler
    newItem.onclick = () => window.openLightbox(imgUrl, captionText);
    
    newItem.innerHTML = `
        <div class="img-wrap">
            <img src="${imgUrl}" alt="${captionText}" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\\'padding: 20px; text-align: center; color: #555;\\'>Image Missing</div>'" />
            <div class="overlay"><span>View Photo</span></div>
        </div>
        <p class="img-caption">${captionText}</p>
    `;
    return newItem;
}

window.addEventListener('load', () => {
    const heroImg = document.getElementById('hero-img');
    if (heroImg) heroImg.classList.add('loaded');
    document.querySelectorAll('.hero-deco').forEach(el => el.classList.add('loaded'));
    
    loadGallery();
});
</script>
</body>
</html>
